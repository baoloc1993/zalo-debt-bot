# Local MySQL for development. Credentials match .env.example.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: zalobot
      MYSQL_USER: zalobot
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-me-root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uzalobot", "-pchange-me"]
      interval: 5s
      retries: 20
volumes:
  mysql-data:
