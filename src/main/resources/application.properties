zalo.app.id=REDACTED_ZALO_APP_ID
zalo.app.secret=${ZALO_APP_SECRET}
zalo.redirect.uri=http://localhost:8080/zalo/callback
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com

# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/zalo-bot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=zalobot_user
spring.datasource.password=REDACTED_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=debug
logging.level.com.example.zalobot=debug
server.port=8081
zalo.scheduled.users=REDACTED_ZALO_USER_ID
spring.profiles.active=local
