# -----------------------------------------------------------------------------
# All environment-specific values and credentials are read from environment
# variables. Nothing secret is stored in this file.
# See .env.example and application-local.properties.example.
# -----------------------------------------------------------------------------

server.port=${SERVER_PORT:8081}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Zalo Official Account
zalo.app.id=${ZALO_APP_ID}
zalo.app.secret=${ZALO_APP_SECRET}
zalo.oa.id=${ZALO_OA_ID}
zalo.redirect.uri=${ZALO_REDIRECT_URI:http://localhost:8081/zalo/callback}
# Comma-separated Zalo user IDs whose conversations the scheduler polls (optional)
zalo.scheduled.users=${ZALO_SCHEDULED_USERS:}

# Google Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com}

# MySQL datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.io.github.baoloc1993.zalobot=info
